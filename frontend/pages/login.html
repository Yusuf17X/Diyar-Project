<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diyar - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../src/style.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: var(--c-bg);
            font-family: "Inter", system-ui, -apple-system, sans-serif;
            color: var(--c-text-primary);
            padding: 20px;
        }
        .auth-card {
            width: min(440px, 100%);
            background: var(--c-surface);
            border: 1px solid var(--c-border);
            border-radius: 20px;
            padding: 40px;
            box-shadow: var(--shadow-lg);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .brand-icon {
            width: 48px;
            height: 48px;
            background: var(--c-primary-subtle);
            color: var(--c-primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
    </style>
</head>
<body>
    <main class="auth-card anim-fade-up">
        <div class="auth-header">
            <div class="brand-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect>
                    <path d="M9 22v-4h6v4"></path>
                </svg>
            </div>
            <h1 class="text-2xl mb-1">Welcome Back</h1>
            <p class="text-subtitle">Enter your details to access your portal</p>
        </div>

        <form id="login-form" class="flex-col gap-5">
            <div>
                <label class="form-label mb-2 block font-semibold">Email Address</label>
                <input type="email" id="email" class="form-input" placeholder="name@example.com" required>
            </div>
            <div>
                <div class="flex-between mb-2">
                    <label class="form-label block font-semibold">Password</label>
                    <a href="#" class="text-link-sm">Forgot password?</a>
                </div>
                <input type="password" id="password" class="form-input" placeholder="••••••••" required>
            </div>
            <button type="submit" id="submit-btn" class="btn-primary w-full py-3 mt-4">
                Sign In
            </button>
        </form>

        <p class="text-center mt-8 text-sm text-muted">
            Don't have an account? <a href="./signup.html" class="text-link-sm">Create an account</a>
        </p>

        <div class="mt-8 pt-8 border-t border-border">
            <a href="../gateway.html" class="flex-center gap-2 text-muted text-sm hover:text-primary transition-colors">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Back to Gateway
            </a>
        </div>
    </main>

    <div id="toast-container" class="toast-container"></div>
    <script src="../src/shared/api.js"></script>
    <script src="../src/shared/ui.js"></script>
    <script src="../src/pages/login.js"></script>
</body>
</html>
