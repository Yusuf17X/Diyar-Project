<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diyar - Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../src/style.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: var(--c-bg);
            font-family: "Inter", system-ui, -apple-system, sans-serif;
            color: var(--c-text-primary);
            padding: 20px;
        }
        .auth-card {
            width: min(520px, 100%);
            background: var(--c-surface);
            border: 1px solid var(--c-border);
            border-radius: 20px;
            padding: 40px;
            box-shadow: var(--shadow-lg);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .brand-icon {
            width: 48px;
            height: 48px;
            background: var(--c-primary-subtle);
            color: var(--c-primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }
        .role-option {
            border: 2px solid var(--c-border);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }
        .role-option:hover {
            border-color: var(--c-primary-light);
            background: var(--c-surface-alt);
        }
        .role-option.active {
            border-color: var(--c-primary);
            background: var(--c-primary-subtle);
        }
        .role-option input {
            display: none;
        }
        .role-name {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <main class="auth-card anim-fade-up">
        <div class="auth-header">
            <div class="brand-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect>
                    <path d="M9 22v-4h6v4"></path>
                </svg>
            </div>
            <h1 class="text-2xl mb-1">Create Account</h1>
            <p class="text-subtitle">Join Diyar to manage your property</p>
        </div>

        <form id="signup-form">
            <p class="form-label mb-3 block font-semibold text-sm">I am a...</p>
            <div class="role-selector" style="grid-template-columns: repeat(2, 1fr); gap: 10px;">
                <label class="role-option active" data-role="resident">
                    <input type="radio" name="role" value="resident" checked>
                    <div class="role-icon mb-1">🏠</div>
                    <span class="role-name">Resident</span>
                </label>
                <label class="role-option" data-role="admin">
                    <input type="radio" name="role" value="admin">
                    <div class="role-icon mb-1">🏢</div>
                    <span class="role-name">Admin</span>
                </label>
                <label class="role-option" data-role="security">
                    <input type="radio" name="role" value="security">
                    <div class="role-icon mb-1">🛡️</div>
                    <span class="role-name">Security</span>
                </label>
                <label class="role-option" data-role="staff">
                    <input type="radio" name="role" value="staff">
                    <div class="role-icon mb-1">🔧</div>
                    <span class="role-name">Technician</span>
                </label>
            </div>

            <div class="grid-2 gap-4 mb-5">
                <div>
                    <label class="form-label mb-2 block font-semibold text-sm">Full Name</label>
                    <input type="text" id="fullname" class="form-input" placeholder="John Doe" required>
                </div>
                <div>
                    <label class="form-label mb-2 block font-semibold text-sm">Email</label>
                    <input type="email" id="email" class="form-input" placeholder="john@example.com" required>
                </div>
            </div>

            <div class="mb-5">
                <label class="form-label mb-2 block font-semibold text-sm">Compound / Property Name</label>
                <input type="text" id="property" class="form-input" placeholder="Enter your compound name" required>
            </div>

            <div class="grid-2 gap-4 mb-6">
                <div>
                    <label class="form-label mb-2 block font-semibold text-sm">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                </div>
                <div>
                    <label class="form-label mb-2 block font-semibold text-sm">Confirm Password</label>
                    <input type="password" id="confirm" class="form-input" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" id="submit-btn" class="btn-primary w-full py-3">
                Create Account
            </button>
        </form>

        <p class="text-center mt-8 text-sm text-muted">
            Already have an account? <a href="./login.html" class="text-link-sm">Sign in</a>
        </p>

        <div class="mt-8 pt-8 border-t border-border">
            <a href="../gateway.html" class="flex-center gap-2 text-muted text-sm hover:text-primary transition-colors">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Back to Gateway
            </a>
        </div>
    </main>

    <div id="toast-container" class="toast-container"></div>
    <script src="../src/shared/api.js"></script>
    <script src="../src/shared/ui.js"></script>
    <script src="../src/pages/signup.js"></script>
</body>
</html>
